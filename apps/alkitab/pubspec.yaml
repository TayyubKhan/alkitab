name: alkitab
description: "Quran ChatBot"

publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  alkitab_ui:
    path: ../../packages/alkitab_ui
  alkitab_models:
    path: ../../packages/alkitab_models
  alkitab_core:
    path: ../../packages/alkitab_core
  alkitab_quran:
    path: ../../packages/features/alkitab_quran

  # --- CORE UTILS & UI ---
  logger: ^2.4.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  icons_plus: ^5.0.0
  flutter_markdown: ^0.7.3
  flutter_spinkit: ^5.2.1
  grouped_list: ^6.0.0
  scrollable_positioned_list: ^0.3.8
  visibility_detector: ^0.4.0+2
  html: ^0.15.4
  # --- STATE MANAGEMENT ---
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # --- FIREBASE & AUTH ---
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  firebase_ai: ^3.6.1
  google_sign_in: ^7.2.0
  google_generative_ai: ^0.4.7

  # --- NAVIGATION & STORAGE ---
  go_router: ^17.0.1
  shared_preferences: ^2.5.3
  shared_preferences_android: ^2.3.4
  flutter_secure_storage: ^10.0.0
  encrypt: ^5.0.3
  dotenv: ^4.2.0
  flutter_dotenv: ^6.0.0

  # --- NETWORKING ---
  http: ^1.5.0
  connectivity_plus: ^7.0.0
  cached_network_image: any
  url_launcher: ^6.3.1
  share_plus: ^12.0.1

  # --- DATABASE (Drift) ---
  drift: ^2.29.0
  sqlite3_flutter_libs: ^0.5.40
  path_provider: ^2.1.5
  path: ^1.9.1

  # --- AUDIO ---
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.13
  audio_session: ^0.2.2
  flutter_svg: ^2.2.3
  groq: ^1.1.1
  shake: ^3.0.0
  screenshot: ^3.0.0
  flutter_email_sender: ^8.0.0
  device_info_plus: ^11.1.1
  package_info_plus: ^8.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

  # --- CODE GENERATION ---
  build_runner: ^2.7.1
  drift_dev: ^2.29.0
  riverpod_generator: ^3.0.3
  mocktail: ^1.0.4
  melos: ^6.3.1
  flutter_native_splash: ^2.4.0

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash_logo.png
  android_12:
    image: assets/splash_logo.png
    color: "#FFFFFF"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/blue.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/svgs/
    - assets/blue.png
    - assets/qudwa_logo.png


  fonts:
    # 1. Quran Font (PDMS Saleem)
    - family: quranfont
      fonts:
        - asset: assets/QuranFont/font.ttf

    # 2. Poppins (Headings)
    - family: Poppins
      fonts:
        - asset: assets/Poppins/Poppins-Regular.ttf
        - asset: assets/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/Poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/Poppins/Poppins-Italic.ttf
          style: italic
    - family: Amiri
      fonts:
        - asset: assets/Amiri/Amiri-Regular.ttf


    # 3. Lato (Body Text)
    - family: Lato
      fonts:
        - asset: assets/Lato/Lato-Regular.ttf
        - asset: assets/Lato/Lato-Bold.ttf
          weight: 700
        - asset: assets/Lato/Lato-Italic.ttf
          style: italic

    # 4. Libre Baskerville (Translations)
    # Note: Using the 'static' folder files as they are more stable for Flutter than VariableFont_wght
    - family: LibreBaskerville
      fonts:
        - asset: assets/Libre_Baskerville/static/LibreBaskerville-Regular.ttf
        - asset: assets/Libre_Baskerville/static/LibreBaskerville-Bold.ttf
          weight: 700
        - asset: assets/Libre_Baskerville/static/LibreBaskerville-Italic.ttf
          style: italic

    # 5. Gulzar (Urdu)
    - family: Gulzar
      fonts:
        - asset: assets/Gulzar/Gulzar-Regular.ttf

    # 6. Gentium Plus (Transliteration)
    - family: GentiumPlus
      fonts:
        - asset: assets/Gentium_Plus/GentiumPlus-Regular.ttf
        - asset: assets/Gentium_Plus/GentiumPlus-Italic.ttf
          style: italic
        - asset: assets/Gentium_Plus/GentiumPlus-Bold.ttf
          weight: 700

    # 7. GT Super Text Book (Headings/Titles)
    - family: GT-Super-Text-Book
      fonts:
        - asset: assets/GT_Super/GT-Super-Text-Book.ttf
    # 8. Noto Naskh Arabic
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/Noto_Naskh_Arabic/NotoNaskhArabic-VariableFont_wght.ttf

